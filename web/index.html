<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雪球组合监控</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>雪球组合监控</h1>
        <p class="brand-sub">持仓变动 · 实时看板</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="server-time" class="meta-chip">—</span>
      <button id="btn-refresh" class="btn ghost" type="button">刷新</button>
      <a class="btn ghost" href="/config">配置</a>
      <button id="btn-xueqiu-login" class="btn ghost" type="button">登录雪球</button>
      <button id="btn-check" class="btn primary" type="button">立即检查</button>
    </div>
  </header>

  <main class="layout">
    <section class="stats" id="stats" aria-label="概览"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>监控组合</h2>
        <div class="panel-head-actions">
          <span id="cube-count" class="meta-chip">0</span>
          <button id="btn-cube-live" class="btn ghost sm" type="button">查询原组合</button>
        </div>
      </div>
      <div id="cube-tabs" class="cube-tabs" role="tablist" aria-label="监控组合切换"></div>
      <div id="cubes" class="cube-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>持仓变动</h2>
        <div class="panel-head-actions">
          <span id="changes-live" class="meta-chip live-chip">与钉钉同步</span>
          <span id="changes-count" class="meta-chip">0</span>
        </div>
      </div>
      <div id="changes" class="change-list" aria-live="polite"></div>
    </section>

    <section class="panel log-panel">
      <div class="panel-head">
        <h2>运行日志</h2>
        <div class="panel-head-actions">
          <span id="log-live" class="meta-chip live-chip">实时</span>
          <button id="btn-log-clear" class="btn ghost sm" type="button">清空</button>
          <button id="btn-log-refresh" class="btn ghost sm" type="button">更新</button>
        </div>
      </div>
      <pre id="logs" class="log-view" aria-live="polite"></pre>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
